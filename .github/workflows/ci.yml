name: ConnectEd CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: connected_test
          POSTGRES_USER: connected_user
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, bcmath, gd, exif, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer Dependencies
        run: |
          composer config policy.advisories.block false
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Environment & Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Test Suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: connected_test
          DB_USERNAME: connected_user
          DB_PASSWORD: secret_password
          DB_SSLMODE: disable
        run: |
          php artisan migrate --force
          php artisan test

      - name: Run Dependency Audits
        run: |
          composer audit || true
          npm audit --omit=dev || true
